controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    smalldog_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster


imu_sensor_broadcaster:
  ros__parameters:
    # must match the <sensor name=...> in smalldog-mujoco.urdf.xacro
    sensor_name: imu_imu
    frame_id: base_link


smalldog_controller:
  ros__parameters:
    joints:
      - fl_roll
      - fl_pitch
      - fl_knee
      - fr_roll
      - fr_pitch
      - fr_knee
      - rl_roll
      - rl_pitch
      - rl_knee
      - rr_roll
      - rr_pitch
      - rr_knee

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_partial_joints_goal: false
    # Start each streamed point from the last COMMANDED state, not the measured one.
    # ros2_controllers 5.7 renamed open_loop_control to this and silently dropped the
    # old key: with it off, every 100 Hz point restarted the interpolation from where
    # the lagging servo actually was, and the trot reached the joints at ~40 % of its
    # amplitude (fl_knee commanded 1.18..1.65 rad, measured 1.26..1.45) - a 0.5 rad/s
    # turn came out at 0.026 rad/s against 0.30 in the standalone sim.
    interpolate_from_desired_state: true
