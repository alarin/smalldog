# The sim node needs the same rate before the controller_manager exists: the joint
# limiters are built inside the resource manager, which it creates first, and they size
# their per-cycle allowance from whatever rate that manager was given (100 Hz by default).
# Set both, or every joint limit is enforced at the wrong scale.  mujoco_ros2_control
# logs an error if these two disagree.
mujoco_ros2_control_node:
  ros__parameters:
    update_rate: 200  # Hz — keep equal to controller_manager's below

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    smalldog_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster


imu_sensor_broadcaster:
  ros__parameters:
    # must match the <sensor name=...> in smalldog-mujoco.urdf.xacro
    sensor_name: imu_imu
    frame_id: base_link


smalldog_controller:
  ros__parameters:
    joints:
      - fl_roll
      - fl_pitch
      - fl_knee
      - fr_roll
      - fr_pitch
      - fr_knee
      - rl_roll
      - rl_pitch
      - rl_knee
      - rr_roll
      - rr_pitch
      - rr_knee

    command_interfaces:
      - position

    state_interfaces:
      - position

    allow_partial_joints_goal: false
    open_loop_control: true
