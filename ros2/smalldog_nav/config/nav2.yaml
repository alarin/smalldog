# Nav2 for a 2.5 kg trotting quadruped that walks at 0.08..0.2 m/s and turns in place.
#
# The numbers that are this robot's, not Nav2's defaults:
#   robot_radius 0.18   the legs sweep x +-0.15, y +-0.09 from base_link; 0.18 covers the
#                       foot at full stride. Inflation 0.35 keeps the planner a body's width
#                       off the wall, which is what a scan sliced at 0.10..0.35 m of a
#                       0.5 m-tall obstacle deserves.
#   FollowPath          regulated pure pursuit, no reversing, rotate-to-heading on: the
#                       trot turns in place happily and walks backwards badly (the swing
#                       profile is fore/aft symmetric, the body levelling is not). The
#                       speed itself is a launch argument (nav.launch.py `speed`) written
#                       over desired_linear_vel, because it differs 2.5x between the sim
#                       and the servo's rate ceiling on the floor (robot.launch.py).
#   rotate_to_heading_angular_vel 0.5 / max_rotational_vel 0.5: the gait's own yaw clamp;
#                       0.65 is the teleop's turn rate and a straight walk plus a turn is
#                       already over the servo budget on hardware (robot.launch.py).
#   enable_stamped_cmd_vel false, everywhere: the walker reads geometry_msgs/Twist.
#   min_y_velocity_threshold 0.5: no lateral commands from Nav2 - the trot can strafe but
#                       its lateral stride is half the fore/aft one, and RPP does not ask.
#   xy_goal_tolerance 0.20: a frontier goal is a place to look from, not a parking spot.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # pose, not simple: a turn in place is progress, and rotate-to-heading at the gait's
    # 0.3 rad/s takes ten seconds for a half turn
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.3
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.6
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      # 0.8 and rotate_to_heading_min_angle 0.3 (from 0.4 / 0.6, 2026-09-15): both falls
      # on the floor were forward + turn at the servo budget's edge, never a straight or
      # a turn in place. Slow earlier on a curve, align first more often. Untested.
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.06
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.3
      # the ramp is one controller step (0.1 s) from the odom twist, which is the gait's
      # command times odom_scale (~0.5 in the sim): at 1.5 the turn converged to 0.3
      max_angular_accel: 1.0      # the RL walker slews at 1 rad/s^2 anyway; 3.2 whipped it
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100      # ms; Nav2's 20 timed out under this launch's load
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
