# slam_toolbox, online async, mapping mode — the map for smalldog_nav.
#
# What is tuned for this robot and why (the rest is slam_toolbox's own defaults):
#   base_frame     base_footprint — the LEVEL frame the walker publishes under base_link,
#                  the one the scan is sliced in. Not base_link: it tilts with the trot.
#   scan_topic     /scan, the 2-D slice pointcloud_to_laserscan cuts out of the L2's cloud
#                  (nav.launch.py). The scan spans +-96 deg about +x - the L2's cone, the
#                  sensor bolted axis-forward - so behind the robot is unknown until it
#                  turns; the explorer spins first for that reason.
#   max_laser_range 6 m: rooms. The L2's own range is unmeasured (3d/ref/lidar/README.md).
#   minimum_travel_distance 0.1 m / heading 0.2 rad: a scan node every 10 cm at 0.08 m/s
#                  is one every ~1.2 s, against 12 frames/s in - plenty, and the odometry
#                  is a dead reckoning off the gait, so nodes close together keep the
#                  scan matcher's search window (0.5 m, 20 deg) honest.
#   loop closing on: the odometry drifts, the room is small, and closing the loop when
#                  the robot comes back to the door is the whole point of a graph.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.3
    max_laser_range: 6.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 6.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
