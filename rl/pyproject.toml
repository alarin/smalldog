# SmallDog RL — the third consumer of the CAD, after 3d/ and ros2/.
#
# This tree deliberately does NOT use pixi the way ros2/ does.  JAX with CUDA
# ships as pip wheels; putting that resolution through a conda channel adds a
# second place for the CUDA version to disagree with itself.  3d/ is a plain uv
# venv for the same reason.
#
#   uv sync --extra cpu     # mac: same code, CPU JAX, seconds-long smoke tests
#   uv sync --extra cuda    # WSL2 + RTX 3070: training
#   uv sync --extra fit     # scipy + matplotlib, for the bench fit (step 3)
#
# The training card is an RTX 3070: Ampere, sm_86, 8 GB.  Ampere is covered by
# every jax[cuda12] wheel, so no CUDA floor is pinned here beyond what jax itself
# requires.  The 8 GB is what actually constrains training — see rl/README.md,
# "Environments", for the num_envs budget and the preallocation flag.
#
# `check_model.py` needs none of those extras: mujoco and numpy are the base
# dependencies, so the model audit runs anywhere, including on the robot.
[project]
name = "smalldog-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
]

# The jax ceiling is not caution, it is a measured incompatibility.  brax's PPO
# (brax/training/pmap.py, and the ppo/sac/apg trainers) calls
# jax.device_put_replicated, which jax deprecated and then REMOVED in 0.11:
#
#   AttributeError: jax.device_put_replicated is deprecated; use jax.device_put
#
# brax 0.14.2 is the newest release there is, so there is no brax that fixes it
# and the ceiling has to go here.  0.10.2 still has the symbol.  Both extras
# carry it because the mac's smoke tests run the same trainer.  Revisit when
# brax ships a release that has moved off pmap; until then, raising this pin
# breaks training on every machine at once.
[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.5.3,<0.10", "mujoco-mjx>=3.2", "brax>=0.12"]
cpu  = ["jax>=0.5.3,<0.10",         "mujoco-mjx>=3.2", "brax>=0.12"]
fit  = ["scipy>=1.13", "matplotlib>=3.8"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

# Nothing here is a distributable package; scripts are run in place
# (`uv run python checks/check_model.py`).  Skipping the build backend keeps the
# tree free of a wheel nobody installs.
[tool.uv]
package = false
